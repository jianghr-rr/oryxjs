# Lefthook configuration (optional wrapper over .githooks/)
# Install: brew install lefthook && lefthook install
# Without lefthook, enable directly via: git config core.hooksPath .githooks

pre-commit:
  parallel: false
  commands:
    repo-guard:
      run: .githooks/pre-commit

    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: .githooks/commit-msg {1}

pre-push:
  commands:
    block-direct-main-push:
      run: .githooks/pre-push
